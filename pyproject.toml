[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zavtra"
version = "0.1.0"
description = "Закупка на завтра для небольших точек общепита"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Бакиев Мехроб Мехрзодович"}]
dependencies = [
  "aiogram>=3.20,<4",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
  "python-dotenv>=1,<2",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[project.scripts]
zavtra = "zavtra.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
