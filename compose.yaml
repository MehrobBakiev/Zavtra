services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: zavtra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: zavtra
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zavtra -d zavtra"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  bot:
    build: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      DATABASE_URL: postgresql+psycopg://zavtra@db:5432/zavtra
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
